<!-- Есть несколько способов подключить JS файл -->
<!-- Первый в самом конце тега <body>, так как браузер читает html код сверху вниз, он сперва строит html потом смотрит JS  -->
<!-- Второй способ вписать скрипт в <head> с отрибутом defer, в таком случае сперва загружается весь сайт затем js, и мы как бы откладываем загрузку js файла, если файлов несколько то они выполняются по порядку -->
<!-- Третий способ так же вписать в <head> с отрибутом async, он запускает полностью независимую загрузку. Браузер скачивает скрипт в фоновом режиме, но в ту же секунду, как файл скачался, браузер останавливает разбор HTML и выполняет скрипт. -->
